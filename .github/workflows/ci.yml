name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.27"
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --extra android --all-groups --frozen

      - name: Install recording tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Verify application (shared gate)
        # Keep this identical to the deploy workflow's gate: both call
        # scripts/verify.sh so the lint scope and coverage floor cannot drift.
        run: bash scripts/verify.sh

  dashboard:
    name: Dashboard browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Check frontend types and build
        run: npm run build
      - name: Test desktop and phone interfaces without external services
        run: npm test
